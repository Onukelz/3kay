<div class="card testimonial">
  <div class="grid grid--1x2">
    <div class="testimonial__image">
      <img src="css/images/testimonial.jpg" alt="a happy smiling customer" />
      <span class="icon-container icon-container--accent">
        <svg class="icon--small icon--white">
          <use xlink:href="css/images/sprite.svg#quotes"></use>
        </svg>
      </span>
    </div>
    <div>
      <blockquote class="quote">
        <p class="quote__text">
          Lorem ipsum dolor sit amet consectetur adipisicing elit. Voluptatem at
          pariatur maxime velit sapiente in numquam voluptatibus vel doloremque
          quaerat?
        </p>
        <footer>
          <div class="quote media">
            <div class="quote media__image">
              <svg class="icon">
                <use xlink:href="css/images/sprite.svg#line"></use>
              </svg>
            </div>
            <div class="quote media__body">
              <h3 class="quote__author media__title">John Smith</h3>
              <p class="quote__company">ABC Company</p>
            </div>
          </div>
        </footer>
      </blockquote>
    </div>
  </div>
</div>
